@ECHO off
java -jar forge-1.12.2-14.23.5.2864-installer.jar
pause<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { font-family: sans-serif; background: #1c1c1e; color: white; padding: 20px; }
        .card { background: #2c2c2e; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        h2 { color: #0a84ff; margin-top: 0; }
        .item { display: flex; align-items: center; padding: 18px 0; border-bottom: 1px solid #3a3a3c; font-size: 20px; }
        input[type="checkbox"] { width: 28px; height: 28px; margin-right: 15px; }
        button { width: 100%; background: #30d158; color: white; border: none; padding: 20px; border-radius: 15px; font-size: 22px; font-weight: bold; }
        .stats { display: grid; grid-template-columns: 1fr auto; gap: 15px; font-size: 18px; }
        .count { color: #ffd60a; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🌙 今晚保養紀錄</h2>
        <div id="list"></div><br>
        <button onclick="save()">✅ 儲存紀錄</button>
    </div>
    <div class="card">
        <h2>📊 過去 7 天次數</h2>
        <div id="stats" class="stats"></div>
    </div>
<script>
    const ps = ["妮維雅夜間修復霜", "雪芙蘭水乳霜", "精華液", "L630", "杏仁酸", "液態飛梭", "泥膜", "去角質", "面膜"];
    let logs = JSON.parse(localStorage.getItem('skLogs') || '[]');
    function render() {
        document.getElementById('list').innerHTML = ps.map(p => `<label class="item"><input type="checkbox" value="${p}"><span>${p}</span></label>`).join('');
        const sevenDaysAgo = Date.now() - 7*24*60*60*1000;
        const recent = logs.filter(l => l.d >= sevenDaysAgo);
        document.getElementById('stats').innerHTML = ps.map(p => {
            const c = recent.filter(l => l.i.includes(p)).length;
            return `<div>${p}</div><div class="count">${c} 次</div>`;
        }).join('');
    }
    function save() {
        const sel = Array.from(document.querySelectorAll('input:checked')).map(c => c.value);
        if (sel.length === 0) return alert('請勾選！');
        logs.push({ d: Date.now(), i: sel });
        localStorage.setItem('skLogs', JSON.stringify(logs));
        alert('儲存完成！'); render();
    }
    render();
</script>
</body>
</html>
