<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的保養管家</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f8ff; color: #333; padding: 20px; line-height: 1.6; padding-bottom: 50px; }
        .card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(0,122,255,0.1); border: 1px solid #e1f0ff; position: relative; }
        h2 { color: #007aff; margin-top: 0; font-size: 20px; border-bottom: 2px solid #e1f0ff; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        
        .date-row { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; }
        .date-input { flex: 2; padding: 12px; border-radius: 10px; border: 1px solid #add8e6; font-size: 18px; }
        .day-label { flex: 1; text-align: center; background: #e1f0ff; color: #007aff; padding: 12px; border-radius: 10px; font-weight: bold; }
        
        .item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f8ff; font-size: 18px; }
        input[type="checkbox"] { width: 22px; height: 22px; margin-right: 15px; accent-color: #007aff; }
        
        button { width: 100%; background: #007aff; color: white; border: none; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button.secondary { background: #e1f0ff; color: #007aff; font-size: 14px; padding: 5px 10px; width: auto; margin: 0; }
        button.save-btn { background: #30d158; }
        button.del-btn { background: #ff3b30; width: auto; padding: 5px 10px; font-size: 14px; margin: 0; }

        /* 管理模式樣式 */
        #manageSection { display: none; margin-top: 10px; background: #f9fcff; padding: 15px; border-radius: 10px; border: 1px dashed #add8e6; }
        .manage-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #e1f0ff; }
        .add-row { display: flex; gap: 5px; margin-top: 10px; }
        .add-input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #add8e6; }

        .stats-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0faff; }
        .count-tag { color: #007aff; font-weight: bold; }
        .history-item { background: #f9fcff; border: 1px solid #e1f0ff; padding: 12px; border-radius: 10px; margin-bottom: 10px; position: relative; }
        .history-date { font-weight: bold; color: #007aff; margin-bottom: 5px; }
        .history-content { font-size: 14px; color: #666; padding-right: 60px; }
        .hint { font-size: 12px; color: #8aacc8; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>
            ✨ 每日保養登記
            <button class="secondary" onclick="toggleManage()">⚙️ 管理種類</button>
        </h2>

        <div id="manageSection">
            <p class="hint">新增或刪除保養品種類：</p>
            <div id="manageList"></div>
            <div class="add-row">
                <input type="text" id="newProductName" class="add-input" placeholder="輸入新產品名稱">
                <button class="secondary" style="background:#007aff; color:white;" onclick="addProduct()">新增</button>
            </div>
            <button onclick="toggleManage()" style="background:#8e8e93; font-size:14px; padding:8px;">完成管理</button>
        </div>

        <div id="mainInputArea">
            <p class="hint">選擇日期並勾選使用的產品</p>
            <div class="date-row">
                <input type="date" id="targetDate" class="date-input" onchange="updateDayLabel()">
                <div id="dayLabel" class="day-label"></div>
            </div>
            <div id="checkList"></div>
            <button class="save-btn" onclick="saveLog()">確認儲存紀錄</button>
        </div>
    </div>

    <div class="card">
        <h2>📊 過去 7 天統計</h2>
        <div id="statsList"></div>
    </div>

    <div class="card">
        <h2>📜 歷史紀錄</h2>
        <div id="historyList"></div>
    </div>

<script>
    // 預設產品清單，若本地有存則讀取本地
    let products = JSON.parse(localStorage.getItem('skProducts')) || ["妮維雅夜間修復霜", "雪芙蘭水乳霜", "精華液", "l630", "杏仁酸", "液態飛梭", "泥膜", "去角質", "面膜"];
    const weekDays = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
    let logs = JSON.parse(localStorage.getItem('skLogs') || '[]');

    function updateDayLabel() {
        const val = document.getElementById('targetDate').value;
        const date = new Date(val);
        document.getElementById('dayLabel').innerText = weekDays[date.getDay()];
    }

    function toggleManage() {
        const sec = document.getElementById('manageSection');
        const main = document.getElementById('mainInputArea');
        if(sec.style.display === 'none' || sec.style.display === '') {
            sec.style.display = 'block';
            main.style.display = 'none';
            renderManageList();
        } else {
            sec.style.display = 'none';
            main.style.display = 'block';
            renderAll();
        }
    }

    function renderManageList() {
        document.getElementById('manageList').innerHTML = products.map((p, index) => `
            <div class="manage-item">
                <span>${p}</span>
                <button class="del-btn" onclick="removeProduct(${index})">刪除</button>
            </div>
        `).join('');
    }

    function addProduct() {
        const name = document.getElementById('newProductName').value.trim();
        if(name && !products.includes(name)) {
            products.push(name);
            localStorage.setItem('skProducts', JSON.stringify(products));
            document.getElementById('newProductName').value = '';
            renderManageList();
        }
    }

    function removeProduct(index) {
        if(confirm(`確定要刪除「${products[index]}」嗎？這不會刪除歷史紀錄，但以後無法再勾選。`)) {
            products.splice(index, 1);
            localStorage.setItem('skProducts', JSON.stringify(products));
            renderManageList();
        }
    }

    function renderAll() {
        // 更新打勾清單
        document.getElementById('checkList').innerHTML = products.map(p => `
            <label class="item">
                <input type="checkbox" value="${p}">
                <span>${p}</span>
            </label>
        `).join('');

        // 更新統計
        const sevenDaysAgoStr = new Date(Date.now() - 7*24*60*60*1000).toISOString().split('T')[0];
        const recentLogs = logs.filter(log => log.date >= sevenDaysAgoStr);
        const counts = {};
        products.forEach(p => counts[p] = 0);
        recentLogs.forEach(log => {
            log.items.forEach(item => { if(counts[item] !== undefined) counts[item]++; });
        });
        document.getElementById('statsList').innerHTML = products.map(p => `
            <div class="stats-row"><span>${p}</span><span class="count-tag">${counts[p]} 次</span></div>
        `).join('');

        // 更新歷史
        document.getElementById('historyList').innerHTML = logs.map(log => `
            <div class="history-item">
                <div class="history-date">${log.date} (${weekDays[new Date(log.date).getDay()]})</div>
                <div class="history-content">${log.items.join(', ')}</div>
                <button class="del-btn" style="position:absolute; right:10px; top:15px;" onclick="deleteLog('${log.date}')">刪除</button>
            </div>
        `).join('');
    }

    function saveLog() {
        const dateVal = document.getElementById('targetDate').value;
        const selected = Array.from(document.querySelectorAll('#checkList input:checked')).map(cb => cb.value);
        if (!dateVal || selected.length === 0) return alert('請選擇日期與產品！');

        logs = logs.filter(log => log.date !== dateVal);
        logs.push({ date: dateVal, items: selected });
        logs.sort((a, b) => b.date.localeCompare(a.date));
        localStorage.setItem('skLogs', JSON.stringify(logs));
        renderAll();
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        alert('儲存成功！');
    }

    function deleteLog(date) {
        if (confirm(`確定刪除 ${date} 的紀錄？`)) {
            logs = logs.filter(log => log.date !== date);
            localStorage.setItem('skLogs', JSON.stringify(logs));
            renderAll();
        }
    }

    // 初始執行
    document.getElementById('targetDate').value = new Date().toISOString().split('T')[0];
    updateDayLabel();
    renderAll();
</script>
</body>
</html>
