<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>保養品日期紀錄器</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #1c1c1e; color: white; padding: 20px; line-height: 1.6; }
        .card { background: #2c2c2e; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { color: #0a84ff; margin-top: 0; font-size: 20px; }
        
        /* 日期選擇器樣式 */
        .date-input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #3a3a3c; background: #3a3a3c; color: white; font-size: 18px; margin-bottom: 15px; box-sizing: border-box; }
        
        .item { display: flex; align-items: center; padding: 15px 0; border-bottom: 1px solid #3a3a3c; cursor: pointer; font-size: 18px; }
        input[type="checkbox"] { width: 25px; height: 25px; margin-right: 15px; accent-color: #30d158; }
        
        button { width: 100%; background: #0a84ff; color: white; border: none; padding: 18px; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:active { background: #0056b3; }
        
        .stats-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #3a3a3c; }
        .count-tag { color: #ffd60a; font-weight: bold; font-size: 18px; }
        .hint { font-size: 12px; color: #8e8e93; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📅 選擇日期與產品</h2>
        <p class="hint">預設為今天，你也可以補登過去的日期</p>
        <input type="date" id="targetDate" class="date-input">
        
        <div id="checkList"></div>
        <button onclick="saveLog()">確認儲存</button>
    </div>

    <div class="card">
        <h2>📊 過去 7 天使用次數</h2>
        <p class="hint">基於今天起算的前 7 天數據</p>
        <div id="statsList"></div>
    </div>

<script>
    const products = ["妮維雅夜間修復霜", "雪芙蘭水乳霜", "精華液", "L630", "杏仁酸", "液態飛梭", "泥膜", "去角質", "面膜"];
    
    // 初始化日期選擇器為今天
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('targetDate').value = today;

    // 讀取資料
    let logs = JSON.parse(localStorage.getItem('skLogs') || '[]');

    function renderItems() {
        const list = document.getElementById('checkList');
        list.innerHTML = products.map(p => `
            <label class="item">
                <input type="checkbox" value="${p}">
                <span>${p}</span>
            </label>
        `).join('');
    }

    function saveLog() {
        const dateVal = document.getElementById('targetDate').value;
        if (!dateVal) return alert('請先選擇日期！');

        const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
        if (checkboxes.length === 0) return alert('請至少勾選一項！');

        const selected = Array.from(checkboxes).map(cb => cb.value);
        
        // 檢查該日期是否已有紀錄，有的話先刪除（視為覆蓋）
        logs = logs.filter(log => log.date !== dateVal);
        
        const newEntry = { date: dateVal, items: selected };
        logs.push(newEntry);
        localStorage.setItem('skLogs', JSON.stringify(logs));
        
        // 重設勾選
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        renderStats();
        alert(dateVal + ' 紀錄成功！');
    }

    function renderStats() {
        const statsList = document.getElementById('statsList');
        
        // 計算 7 天前的日期字串
        const now = new Date();
        const sevenDaysAgoDate = new Date();
        sevenDaysAgoDate.setDate(now.getDate() - 7);
        const sevenDaysAgoStr = sevenDaysAgoDate.toISOString().split('T')[0];
        
        // 過濾出最近 7 天的紀錄
        const recentLogs = logs.filter(log => log.date >= sevenDaysAgoStr);
        
        const counts = {};
        products.forEach(p => counts[p] = 0);
        recentLogs.forEach(log => {
            log.items.forEach(item => { if(counts[item] !== undefined) counts[item]++; });
        });

        statsList.innerHTML = products.map(p => `
            <div class="stats-row">
                <span>${p}</span>
                <span class="count-tag">${counts[p]} 次</span>
            </div>
        `).join('');
    }

    renderItems();
    renderStats();
</script>
</body>
</html>
